# Template: the goAirside AI change report for a GitLab project, as .gitlab/goairside-report.yml, which
# .gitlab-ci.yml includes. It reports which code AI coding agents wrote, from the traces in .goairside/:
#   merge requests: the HTML report of the merge request, and a Code Quality report of all AI code
#   branches:       only that Code Quality report. GitLab shows a merge request the AI code that is new
#                   compared with its target branch's report, so every branch needs one.
goairside-report:
  # Any stage of the project works: the job needs nothing from other jobs, so it starts right away.
  stage: test
  needs: []
  image: node:22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Also branches with an open merge request: they can be another merge request's target (develop → main).
    - if: $CI_COMMIT_BRANCH
  variables:
    # The report compares the merge request with its target branch and reads every trace, so it needs the history.
    GIT_DEPTH: 0
  script:
    # Pin a version (apichap-ai-coding-gateway@1.2.3) for the same results on every run.
    - npx -y apichap-ai-coding-gateway@latest report --out goairside-report
  artifacts:
    paths: [goairside-report/]
    reports:
      # Shows each AI change in the merge request widget and the "Changes" tab.
      codequality: goairside-report/gl-code-quality.json
